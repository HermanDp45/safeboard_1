apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vllm-cpu
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - storage.yaml
configMapGenerator:
  - name: vllm-env
    literals:
      - MODEL_ID=Qwen/Qwen2.5-0.5B-Instruct
      - MODEL_REVISION=7ae557604adf67be50417f59c2c2f167def9a775
      - OMP_NUM_THREADS=2
      - VLLM_CPU_OMP_THREADS_BIND=nobind
  - name: vllm-config
    files:
      - serve.yaml
      - logging.json
secretGenerator:
  - name: vllm-secrets
    envs:
      - .env
